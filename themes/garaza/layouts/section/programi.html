{{ partial "header.html" . }}

<section>
    <img src="/img/cover1.jpg" alt="" class="cover">
</section>

<section id="notifications-container" class="notification">
    <div class="container">
        <ul>
            <li>
                <h2>{{ .Title }} </h2>
            </li>
        </ul>
    </div>
</section>


<div class="container">
    {{ range .Data.Pages.GroupByDate "2006" }}
      <div class="skip-medium">
          <div class="row">
              {{ range .Pages.ByWeight }}
                {{ .Render "li_box" }}
              {{ end }}
          </div>
          <br>
      </div>
    {{ end }}
</div>

{{ partial "footer.html" . }}

</body>

</html>
